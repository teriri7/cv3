name: Build EXE

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'  # 使用最新稳定版Python
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests
        pip list  # 显示已安装的包，用于调试
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name "ImageAnalyzer" --windowed --icon=None x.py
        # 注意这里已将入口文件改为x.py
        # --windowed 确保运行时没有命令行窗口（适合GUI程序）
        # --onefile 打包成单个exe文件
        # --icon=None 不使用图标，如需图标可替换为.ico文件路径
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImageAnalyzer-exe
        path: dist/ImageAnalyzer.exe
