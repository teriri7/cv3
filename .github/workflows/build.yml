name: Build EXE

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow tkinterdnd2 requests
        pip list  # 显示已安装包，便于调试
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name "合并图片" --windowed --hidden-import tkinterdnd2 hb.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 合并图片-exe
        path: dist/合并图片.exe
