name: Build Excel Image Extractor EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'hbc.py'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'hbc.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # 支持手动在 GitHub 页面点击触发

jobs:
  build-windows-exe:
    runs-on: windows-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests beautifulsoup4 Pillow pyautogui pyperclip pywin32
        pip list  # 输出依赖版本，便于排查构建环境
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "Excel网页图片提取合并工具" --hidden-import win32clipboard --hidden-import pyautogui --hidden-import PIL --hidden-import bs4 hbc.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Excel网页图片提取合并工具-exe
        path: dist/Excel网页图片提取合并工具.exe
